name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/726193930702/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-sa@compass-490014.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy compass \
            --source . \
            --region us-central1 \
            --allow-unauthenticated \
            --port 8080 \
            --timeout 3600 \
            --session-affinity \
            --set-secrets "GOOGLE_API_KEY=GOOGLE_API_KEY:latest" \
            --project compass-490014
